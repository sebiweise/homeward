<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homeward</title>
<link rel="icon" href="images/icon_32.png">
<link rel="stylesheet" href="homeward.css">
</head>
<body>
<aside class="side">
  <div class="side-tools">
    <button id="add" class="primary" data-t="ui:add"></button>
    <button id="service" class="tool" data-t="ui:service"></button>
  </div>
  <ul id="side-list" class="side-list"></ul>
  <nav class="side-modes">
    <button data-mode="jobs" data-t="nav:jobs"></button>
    <button data-mode="accounts" data-t="nav:accounts"></button>
  </nav>
  <div id="version" class="muted version"></div>
</aside>
<main class="detail">
  <nav id="tabs" class="tabs" role="tablist"></nav>
  <div id="message" class="message" hidden></div>
  <div id="content" class="content"></div>
</main>
<dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
<dialog id="picker" class="picker"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
