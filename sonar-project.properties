# SonarCloud analysis, run by .github/workflows/sonarcloud.yml.
# Keys follow SonarCloud's defaults for an imported GitHub repository; adjust them if
# the project was created with different ones.
sonar.organization=sebiweise
sonar.projectKey=sebiweise_homeward
sonar.projectName=Homeward

sonar.sources=src,package,tools
sonar.tests=tests
sonar.exclusions=package/ui/images/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
