# Example for running Homeward in Docker; see docs/docker.md.
# Copy to docker-compose.yml, adjust the paths and the password, then:
#   docker compose up -d
services:
  homeward:
    image: homeward:latest
    build: .
    container_name: homeward
    restart: unless-stopped
    init: true  # reaps the sync processes the daemon starts
    # Must own /config and be able to write the folders below /data.
    user: "1000:1000"
    environment:
      TZ: Europe/Berlin
      # Leave the password out to run headless from config/config.toml only.
      HOMEWARD_WEB_PASSWORD: change-me
      # HOMEWARD_WEB_USER: admin
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      # Every folder below /data shows up in the folder picker.
      - /srv/photos:/data/photos
      - /srv/documents:/data/documents
