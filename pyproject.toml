[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "homeward"
description = "Native Synology DSM package that syncs iCloud Photos and iCloud Drive with the NAS."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Sebastian Goscinski" }]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
icloud = ["pyicloud>=2.7,<2.8", "rich"]  # pyicloud 2.7 imports rich without declaring it
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
homeward = "homeward.cli:main"
homeward-daemon = "homeward.daemon.scheduler:main"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/homeward"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["homeward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
