name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should Homeward behave? Mention the configuration or UI you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other approaches you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iCloud Photos backup
        - iCloud Drive sync
        - Sign-in / 2FA
        - DSM package
        - DSM app / UI
        - CLI
        - Documentation
        - Other
