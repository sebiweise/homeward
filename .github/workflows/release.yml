name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  spk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - run: python tools/build_spk.py --arch ${{ matrix.arch }}
      - if: matrix.arch == 'x64'
        run: sh tools/test_spk_lifecycle.sh dist/homeward-*-x64.spk "${{ steps.python.outputs.python-path }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeward-spk-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeward-python
          path: dist/*
          if-no-files-found: error

  # The SynoCommunity package installs Homeward from PyPI (spksrc/README.md).
  # Uses PyPI trusted publishing: no token, but the "pypi" environment and a
  # trusted publisher for this workflow must be set up once on pypi.org.
  pypi:
    needs: python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/homeward/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homeward-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    needs: [spk, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # gh below gets the token through GH_TOKEN
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: homeward-*
          merge-multiple: true
          path: dist
      # The SynoCommunity package of this version (spksrc/README.md): the spksrc
      # folder with the tag's version in homeward==, SPK_VERS and PKG_VERS.
      - run: |
          python3 tools/spksrc_requirements.py --version "${GITHUB_REF_NAME}"
          tar -czf "dist/homeward-spksrc-${GITHUB_REF_NAME#v}.tar.gz" spksrc
      # Release notes: this version's section of CHANGELOG.md.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" '
            /^## / { found = (index($0, "## [" v "]") == 1); next }
            found' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/*.spk dist/*.whl dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" --title "Homeward ${GITHUB_REF_NAME}" \
            --notes-file notes.md
