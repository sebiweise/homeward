name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  spk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python tools/build_spk.py --arch ${{ matrix.arch }}
      - if: matrix.arch == 'x64'
        run: sh tools/test_spk_lifecycle.sh dist/homeward-*-x64.spk "${{ steps.python.outputs.python-path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: homeward-spk-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error

  release:
    needs: spk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: homeward-spk-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" dist/*.spk
          --repo "${GITHUB_REPOSITORY}" --title "Homeward ${GITHUB_REF_NAME}"
          --generate-notes --prerelease
