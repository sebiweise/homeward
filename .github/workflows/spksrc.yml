name: SynoCommunity package

# Builds the spksrc package in spksrc/ the way SynoCommunity's CI does, so the
# package can be submitted to SynoCommunity/spksrc with confidence. The DSM app is
# taken from this commit instead of the release tarball named in cross/homeward.

on:
  pull_request:
    paths:
      - "spksrc/**"
      - "package/ui/**"
      - ".github/workflows/spksrc.yml"
  workflow_dispatch:

permissions:
  contents: read

# spksrc and its build container are pinned, so a change upstream cannot change a
# build unnoticed. Raise both together on purpose (spksrc/README.md, "Updating the
# pinned spksrc"): the image digest of ghcr.io/synocommunity/spksrc:latest and the
# matching commit of SynoCommunity/spksrc master.
env:
  SPKSRC_COMMIT: f35a5252f6aea9060cef28268d2ceedf1ce57c4e
  SPKSRC_IMAGE: ghcr.io/synocommunity/spksrc@sha256:72eb2a04bcdf8dcf897d2a94d9d75664bcf7951ce26301ccf360d73957c7779b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        arch: [x64-7.2, aarch64-7.2]
    steps:
      - uses: actions/checkout@v7
        with:
          path: homeward
          persist-credentials: false

      - name: Check out spksrc and add the Homeward package
        run: |
          git init -q spksrc
          git -C spksrc fetch -q --depth 1 https://github.com/SynoCommunity/spksrc.git "${SPKSRC_COMMIT}"
          git -C spksrc checkout -q FETCH_HEAD
          cp -R homeward/spksrc/. spksrc/
          version=$(sed -n 's/^PKG_VERS = //p' spksrc/cross/homeward/Makefile)
          mkdir -p spksrc/distrib
          git -C homeward archive --format=tar.gz --prefix="homeward-${version}/" \
            -o "${GITHUB_WORKSPACE}/spksrc/distrib/homeward-${version}.tar.gz" HEAD

      - name: Build
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}/spksrc:/spksrc" -w /spksrc \
            "${SPKSRC_IMAGE}" /bin/bash -euo pipefail -c '
              git config --global --add safe.directory /spksrc
              make setup-synocommunity
              sed -i -e "s|#PARALLEL_MAKE\s*=.*|PARALLEL_MAKE=max|" local.mk
              rm -f cross/homeward/digests
              make -C cross/homeward digests
              make -C spk/homeward arch-${{ matrix.arch }}
            '

      - name: Check the package resources
        # The shared folder permission and the command link come from conf/resource;
        # spksrc only warns when it cannot write them.
        run: |
          tar -xOf spksrc/packages/homeward_*.spk conf/resource | jq -e '
            ."data-share".shares[0].name == "{{wizard_shared_folder_name}}"
            and ."data-share".shares[0].permission.rw == ["sc-homeward"]
            and ."usr-local-linker".bin == ["env/bin/homeward"]'

      - uses: actions/upload-artifact@v7
        with:
          name: homeward-synocommunity-${{ matrix.arch }}
          path: spksrc/packages/homeward_*.spk
          if-no-files-found: error
