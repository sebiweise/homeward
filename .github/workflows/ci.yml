name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: 'pip install --only-binary :all: -e ".[dev]"'
      # The same pinned pyicloud the package bundles, so its tests run instead of skipping.
      - run: 'pip install --only-binary :all: --require-hashes -r requirements/icloud.txt'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=homeward --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY" --cov-fail-under=90
      - run: shellcheck package/scripts/service-setup.sh tools/test_spk_lifecycle.sh spksrc/spk/homeward/src/service-setup.sh

  spk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - run: python tools/build_spk.py --arch ${{ matrix.arch }}
      # The runner is x86_64, so only the x64 package can be installed here.
      - if: matrix.arch == 'x64'
        run: sh tools/test_spk_lifecycle.sh dist/homeward-*-x64.spk "${{ steps.python.outputs.python-path }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeward-spk-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error
