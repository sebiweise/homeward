name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: shellcheck package/scripts/service-setup.sh tools/test_spk_lifecycle.sh

  spk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python tools/build_spk.py --arch ${{ matrix.arch }}
      # The runner is x86_64, so only the x64 package can be installed here.
      - if: matrix.arch == 'x64'
        run: sh tools/test_spk_lifecycle.sh dist/homeward-*-x64.spk "${{ steps.python.outputs.python-path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: homeward-spk-${{ matrix.arch }}
          path: dist/*.spk
          if-no-files-found: error
