version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy"]
    ignore:
      # pyicloud is pinned to 2.7.x on purpose: Homeward uses its private API
      # (see docs/adr/0002-drive-provider.md). Raise the pin by hand after testing.
      - dependency-name: pyicloud
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The lock file the .spk is built from (requirements/icloud.txt, with hashes) and
  # the SynoCommunity package's pins of the same versions, in one pull request so
  # they stay equal (CI checks it: tools/spksrc_requirements.py --check).
  - package-ecosystem: pip
    directories:
      - /requirements
      - /spksrc/spk/homeward/src
    schedule:
      interval: weekly
    groups:
      bundled:
        patterns: ["*"]
    ignore:
      - dependency-name: pyicloud
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Set from the release tag (tools/spksrc_requirements.py --version).
      - dependency-name: homeward
      # spksrc builds cryptography only up to 48.x (HELD_BACK in
      # tools/spksrc_requirements.py); raise major versions by hand.
      - dependency-name: cryptography
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
